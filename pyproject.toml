[build-system]
build-backend = "uv_build"
requires = [ "uv-build>=0.11.21,<0.12" ]

[project]
name = "shizuku"
version = "0.1.0"
description = "Generic minimax game-tree search engine and CLI runner"
readme = "README.md"
requires-python = ">=3.14"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
]
dependencies = []

[dependency-groups]
dev = [
  "pyproject-fmt>=2.25.1",
  "pyright>=1.1.411",
  "pytest>=9.1.1",
  "ruff>=0.15.20",
]

[tool.uv]
package = true

[tool.ruff]
target-version = "py314"
lint.select = [ "B", "C4", "E", "F", "I", "N", "SIM", "UP", "W" ]

[tool.pyright]
typeCheckingMode = "strict"

[tool.tox]
requires = [ "tox>=4.19" ]
env_list = [ "3.14", "format", "format_pyproject", "lint", "type" ]
env.format.commands = [ [ "ruff", "format", "--check" ] ]
env.format.description = "Check format"
env.format_pyproject.commands = [ [ "pyproject-fmt", "--check", "pyproject.toml" ] ]
env.format_pyproject.description = "Check pyproject.toml format"
env.lint.commands = [ [ "ruff", "check" ] ]
env.lint.description = "Lint"
env.type.commands = [ [ "pyright" ] ]
env.type.description = "Run type checks"
env_run_base.commands = [ [ "pytest" ] ]
env_run_base.dependency_groups = [ "dev" ]
env_run_base.description = "Run tests under {base_python}"
